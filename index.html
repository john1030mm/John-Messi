<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JM Tracker Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body data-theme="dark">

<header>
  <div class="brand">JM Tracker</div>
  <div class="controls">
    <button onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</header>

<div class="container">
  
  <!-- شاشة الدخول -->
  <div id="loginSection" class="glass-card">
    <h2 style="text-align: center; border: none;">تسجيل الدخول</h2>
    <input type="text" id="clientIdInput" placeholder="كود العميل">
    <input type="password" id="clientPassInput" placeholder="كلمة المرور">
    <button onclick="login()" id="loginBtn">دخول</button>
  </div>

  <!-- التطبيق الفعلي -->
  <div id="mainApp" style="display: none;">

    <!-- التاب الأول: لوحة التحكم (الماكروز والخطة) -->
    <div id="tab-dashboard" class="tab-content active">
      <div class="glass-card">
        <h2>الخطة ومتابعة اليوم</h2>
        <div style="background: rgba(0, 188, 212, 0.1); border-right: 4px solid var(--primary); padding: 15px; margin-bottom: 20px; border-radius: 12px;">
          <div style="font-weight: bold; color: var(--primary); margin-bottom: 8px;">📋 مطلوب اليوم:</div>
          <div id="coachPlanText" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6;"></div>
        </div>

        <div class="progress-container"><div class="progress-label"><span>السعرات</span><span id="calText">0 / 0</span></div><div class="progress-bar"><div id="calBar" class="progress-fill"></div></div></div>
        <div class="progress-container"><div class="progress-label"><span>البروتين</span><span id="protText">0 / 0g</span></div><div class="progress-bar"><div id="protBar" class="progress-fill"></div></div></div>
        <div class="progress-container"><div class="progress-label"><span>الكارب</span><span id="carbText">0 / 0g</span></div><div class="progress-bar"><div id="carbBar" class="progress-fill"></div></div></div>
        <div class="progress-container"><div class="progress-label"><span>الدهون</span><span id="fatText">0 / 0g</span></div><div class="progress-bar"><div id="fatBar" class="progress-fill"></div></div></div>
      </div>

      <div class="glass-card">
        <h2>التقرير اليومي</h2>
        <div class="water-tracker">
          <button onclick="updateWater(-1)">- كوب</button><span id="waterCount">0 💧</span><button onclick="updateWater(1)">+ كوب</button>
        </div>
        <textarea id="dailyNotes" placeholder="أكلت إيه بره الخطة؟ وإيه أخبار التزامك؟"></textarea>
        <button onclick="saveDailyLog()" id="submitBtn" style="background: var(--success); color: #000;">إرسال التقرير للكوتش 🚀</button>
      </div>
    </div>

    <!-- التاب الثاني: التغذية (البحث والوجبات) -->
    <div id="tab-nutrition" class="tab-content">
      <div class="glass-card">
        <h2>إضافة وجبة</h2>
        <div style="display:flex; gap:10px; position:relative;">
          <input type="text" id="searchInput" onkeyup="handleSearch()" onfocus="handleSearch()" placeholder="ابحث عن أكلة..." style="flex:1;">
          <div id="suggestions" class="suggestions" style="z-index: 9999;"></div>
          <button onclick="toggleScanner()" style="width:55px; padding:0; background:var(--primary); font-size:1.2rem;">📷</button>
        </div>
        
        <div id="scannerContainer"><video id="scannerVideo"></video><button onclick="toggleScanner()" style="background:var(--danger); margin-top:5px;">إغلاق ✖</button></div>

        <input type="number" id="gramsInput" placeholder="الكمية بالجرام (مثال: 150)">
        <button onclick="addMeal()">إضافة الوجبة +</button>

       <div style="display: flex; gap: 5px;">
    <button onclick="document.getElementById('aiImgInput').click()" style="padding: 8px; width: auto; font-size: 0.9rem;">✨ AI</button>
    <input type="file" id="aiImgInput" accept="image/*" style="display: none;" onchange="analyzeFoodAI(this)">
    <button onclick="toggleScanner()" style="padding: 8px; width: auto; font-size: 0.9rem; background: var(--nav-icon); color: white;">📷</button>
       </div>

      <div class="glass-card">
        <h2 style="display: flex; justify-content: space-between;">سجل اليوم <button onclick="resetDay()" style="width: auto; padding: 5px 10px; background: var(--danger); margin: 0; font-size: 12px;">إعادة ضبط 🔄</button></h2>
        <div id="mealsList"></div>
      </div>
    </div>

    <!-- التاب الثالث: التمارين (الجديد) -->
    <div id="tab-workouts" class="tab-content">
      <div class="glass-card">
        <h2>💪 تمرين اليوم</h2>
        <div id="workoutsList">
          <!-- سيتم تحميل التمارين هنا ديناميكياً -->
          <p style="text-align: center; color: var(--text-secondary);">جاري تحميل خطة التمرين...</p>
        </div>
        <button onclick="saveWorkoutLog()" style="background: var(--success); color: #000; margin-top: 20px;">حفظ أوزان اليوم 💾</button>
      </div>
    </div>

  </div> <!-- نهاية mainApp -->

</div>

<!-- Bottom Navigation Bar -->
<nav class="bottom-nav" id="bottomNav" style="display: none;">
  <div class="nav-item active" onclick="switchTab('dashboard', this)">
    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
    الخطة
  </div>
  <div class="nav-item" onclick="switchTab('nutrition', this)">
    <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
    التغذية
  </div>
  <div class="nav-item" onclick="switchTab('workouts', this)">
    <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
    التمارين
  </div>
</nav>

<div id="toast"></div>

<!-- نافذة عرض الفيديو (Modal) -->
<div id="videoModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; flex-direction: column;">
  <div style="width: 90%; max-width: 500px;">
    <div style="text-align: right; margin-bottom: 10px;"><button onclick="closeVideo()" style="width: auto; background: var(--danger); padding: 5px 15px;">إغلاق ✖</button></div>
    <div id="videoContainer" style="width: 100%; border-radius: 12px; overflow: hidden;"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
