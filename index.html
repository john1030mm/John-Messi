<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق تدريب احترافي</title>
    <style>
        :root {
            /* نظام الألوان الفاتح (Light Mode) */
            --bg-body: #f4f7f6;
            --bg-card: rgba(255, 255, 255, 0.7);
            --text-primary: #1a1a24;
            --text-secondary: #555;
            --primary: #4ade80;
            --primary-dark: #22c55e;
            --glass-border: rgba(255, 255, 255, 0.5);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-icon: #888;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            /* نظام الألوان الداكن (Dark Mode) - الافتراضي */
            --bg-body: #121212;
            --bg-card: rgba(30, 30, 40, 0.6);
            --text-primary: #f0f0f0;
            --text-secondary: #aaa;
            --primary: #4ade80;
            --primary-dark: #22c55e;
            --glass-border: rgba(255, 255, 255, 0.1);
            --nav-bg: rgba(20, 20, 25, 0.85);
            --nav-icon: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: var(--bg-body); 
            color: var(--text-primary); 
            padding-bottom: 90px; 
            transition: background 0.3s ease; 
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); }

        .card { padding: 20px; margin-bottom: 20px; }
        
        h2 { font-size: 1.5rem; margin-bottom: 15px; color: var(--primary); }
        h3 { font-size: 1.2rem; margin-bottom: 10px; }

        /* مدخلات النصوص (Inputs) */
        input, select, textarea {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.05); color: var(--text-primary);
            font-size: 1rem; transition: border-color 0.3s ease;
        }
        [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { background: rgba(255,255,255,0.05); }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }

        /* الأزرار (Buttons) */
        button {
            width: 100%; padding: 14px; border-radius: 12px;
            border: none; background: var(--primary); color: #111;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
            transition: transform 0.2s, background 0.3s;
        }
        button:active { transform: scale(0.98); }
        .danger-btn { background: var(--danger); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        /* شريط الماكروز (Progress Bars) */
        .macro-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .progress-bg { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; margin-bottom: 15px; }
        [data-theme="light"] .progress-bg { background: rgba(0,0,0,0.1); }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; }
        .progress-fill.overlimit { background: var(--danger); }

        /* القوائم والوجبات */
        .meal-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid var(--glass-border);
        }
        .meal-item:last-child { border-bottom: none; }
        .meal-macros { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
        .delete-btn { width: auto; padding: 5px 10px; background: none; color: var(--danger); box-shadow: none; font-size: 1.2rem; }

        /* البحث والاقتراحات */
        #suggestions {
            background: var(--bg-card); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            max-height: 200px; overflow-y: auto; display: none; margin-bottom: 15px;
        }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid var(--glass-border); cursor: pointer; }
        .suggestion-item:active { background: rgba(74, 222, 128, 0.2); }

        /* البار السفلي (Bottom Nav) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 15px 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom));
            z-index: 1000; border-radius: 25px 25px 0 0;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--nav-icon); font-size: 0.75rem; text-decoration: none; transition: 0.3s; cursor: pointer;
        }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }

        /* التابات وإدارتها */
        .tab-content { display: none; opacity: 0; }
        .tab-content.active { display: block; opacity: 1; }

        /* الإشعارات (Toast) */
        #toast {
            visibility: hidden; min-width: 250px; background-color: var(--primary); color: #111;
            text-align: center; border-radius: 12px; padding: 16px; position: fixed;
            z-index: 2000; left: 50%; bottom: 100px; transform: translateX(-50%);
            font-weight: bold; font-size: 0.9rem; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 80px; opacity: 0;} to {bottom: 100px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 100px; opacity: 1;} to {bottom: 80px; opacity: 0;} }
        @keyframes swipeAnim { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* المودال (نافذة الفيديو / الباركود) */
        .modal {
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center;
        }
        .modal-content { background: var(--bg-body); padding: 20px; border-radius: 20px; width: 90%; max-width: 500px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; color: var(--text-primary); cursor: pointer; }
    </style>
    <!-- مكتبة الباركود (اختياري) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header">
        <h1 style="font-size: 1.5rem; font-weight: 800;">Fit<span style="color: var(--primary);">Track</span></h1>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="glass card">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="clientIdInput" placeholder="كود العميل (مثال: 1001)">
        <input type="password" id="clientPassInput" placeholder="كلمة المرور">
        <button id="loginBtn" onclick="login()">دخول</button>
    </div>

    <!-- التطبيق الرئيسي (مخفي حتى الدخول) -->
    <div id="mainApp" style="display: none;">
        
        <!-- التاب الأول: الخطة والمتابعة -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="glass card">
                <h3>توجيهات الكوتش 🎯</h3>
                <p id="coachPlanText" style="color: var(--primary); font-weight: bold; line-height: 1.5;"></p>
            </div>

            <!-- الماكروز المتبقية -->
            <div class="glass card">
                <h3>استهلاك اليوم 📊</h3>
                <div class="macro-row"><span>السعرات</span><span id="calText">0 / 0</span></div>
                <div class="progress-bg"><div class="progress-fill" id="calBar"></div></div>
                
                <div class="macro-row"><span>البروتين</span><span id="protText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="protBar"></div></div>
                
                <div class="macro-row"><span>الكارب</span><span id="carbText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="carbBar"></div></div>
                
                <div class="macro-row"><span>الدهون</span><span id="fatText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="fatBar"></div></div>
            </div>

            <div class="glass card">
                <h3>شرب المايه 💧</h3>
                <div style="display: flex; justify-content: space-around; align-items: center; font-size: 1.5rem;">
                    <button onclick="updateWater(-1)" style="width: 50px; background: rgba(255,255,255,0.1); color: var(--text-primary);">-</button>
                    <span id="waterCount" style="font-weight: bold;">0 💧</span>
                    <button onclick="updateWater(1)" style="width: 50px;">+</button>
                </div>
            </div>

            <div class="card" id="submitSection">
                <h3>إرسال التقرير اليومي للكوتش 🚀</h3>
                <textarea id="dailyNotes" rows="3" placeholder="اكتب ملاحظاتك هنا (مثال: نمت كويس، حاسس بإرهاق...)"></textarea>
                
                <!-- زرار رفع الصورة الجديد بشياكة -->
                <div style="margin: 15px 0;">
                    <label for="progressPhoto" style="display: block; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; border: 1px dashed var(--primary); text-align: center; cursor: pointer; color: var(--text-secondary); transition: all 0.3s ease;">
                        <span id="photoStatus">📸 أضف صورة تطور (اختياري)</span>
                        <input type="file" id="progressPhoto" accept="image/*" style="display: none;" onchange="updatePhotoStatus()">
                    </label>
                </div>

                <button id="submitBtn" onclick="saveDailyLog()">إرسال التقرير للكوتش 🚀</button>
            </div>
        </div>

        <!-- التاب الثاني: التغذية والأكل -->
        <div id="tab-nutrition" class="tab-content">
            <div class="glass card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3>سجل أكلك 🍽️</h3>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="document.getElementById('aiImgInput').click()" style="padding: 8px; width: auto; font-size: 0.9rem;">✨ AI</button>
                        <input type="file" id="aiImgInput" accept="image/*" style="display: none;" onchange="analyzeFoodAI(this)">
                        <button onclick="toggleScanner()" style="padding: 8px; width: auto; font-size: 0.9rem; background: var(--nav-icon); color: white;">📷</button>
                    </div>
                </div>
                
                <input type="text" id="searchInput" placeholder="ابحث عن أكلة (دجاج، أرز، شوفان...)" onkeyup="handleSearch()">
                <div id="suggestions"></div>
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="gramsInput" placeholder="الكمية (بالجرام)" style="flex: 2;">
                    <button onclick="addMeal()" style="flex: 1;">إضافة</button>
                </div>
            </div>

            <!-- الكاميرا (مخفية) -->
            <div id="scannerContainer" style="display:none; text-align:center; margin-bottom:15px;">
                <video id="scannerVideo" style="width:100%; border-radius:12px; border:2px solid var(--primary);"></video>
                <p style="font-size:0.8rem; color:var(--text-secondary);">وجه الكاميرا نحو باركود المنتج</p>
            </div>

            <div class="glass card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>وجبات اليوم</h3>
                    <button onclick="resetDay()" class="danger-btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem;">مسح الكل</button>
                </div>
                <div id="mealsList"></div>
            </div>
        </div>

        <!-- التاب الثالث: التمارين -->
        <div id="tab-workouts" class="tab-content">
            <div id="workoutsList">
                <!-- التمارين هتتولد هنا من السكريبت -->
            </div>
            <button onclick="saveWorkoutLog()" style="margin-top: 15px; margin-bottom: 30px;">حفظ الأوزان 💾</button>
        </div>

    </div>
</div>

<!-- نافذة عرض الفيديو -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeVideo()">&times;</span>
        <h3 style="margin-bottom: 15px;">شرح التمرين</h3>
        <div id="videoContainer"></div>
    </div>
</div>

<!-- البار السفلي -->
<div id="bottomNav" class="bottom-nav" style="display: none;">
    <div class="nav-item active" onclick="switchTab('dashboard', this)">
        <span class="nav-icon">📊</span><span>الخطة</span>
    </div>
    <div class="nav-item" onclick="switchTab('nutrition', this)">
        <span class="nav-icon">🍎</span><span>الأكل</span>
    </div>
    <div class="nav-item" onclick="switchTab('workouts', this)">
        <span class="nav-icon">💪</span><span>التمارين</span>
    </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
