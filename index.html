<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Messi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body data-theme="dark">

<div class="container">
    <!-- الـ Header باللوجو -->
<div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0 5px;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <!-- حط لينك اللوجو بتاعك مكان الرابط اللي بين علامتين التنصيص -->
        <img src="https://i.ibb.co/v4RyHHkW/mini-Generated-Image-2sprvs2sprvs2spr.jpg" alt="Logo" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary);">
        <h1 style="font-size: 1.6rem; font-weight: 800; margin: 0;">John<span style="color: var(--primary);">Messi</span></h1>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: center;">
        <button id="langBtn" onclick="toggleLang()" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); border-radius: 12px; padding: 6px 12px; font-size: 0.9rem; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); box-shadow: none; width: auto; height: 35px; display: flex; align-items: center; justify-content: center;">🌐 AR</button>
        <button id="themeBtn" onclick="toggleTheme()" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); border-radius: 50%; width: 35px; height: 35px; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(5px); box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0;">☀️</button>
    </div>
</div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="glass card">
        <h2 id="loginTitle">تسجيل الدخول</h2>
        <input type="text" id="clientIdInput" placeholder="كود العميل (مثال: 1001)">
        <input type="password" id="clientPassInput" placeholder="الباسورد">
        <button id="loginBtn" onclick="login()">ادخل</button>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" style="display: none;">
        
    <!-- التاب الأول: الخطة والمتابعة (تم استعادة التصميم الأصلي) -->
<div id="tab-dashboard" class="tab-content active">
    
    <!-- قسم نصايح الكوتش -->
    <div class="glass card" style="margin-bottom: 20px; padding: 20px;">
        <h3 id="coachPlanTitle" style="margin-bottom: 10px; color: var(--primary); font-size: 1.3rem;">جدول اكلك</h3>
        <p id="coachPlanText" style="color: var(--text-primary); font-weight: bold; line-height: 1.6;"></p>
    </div>

    <!-- قسم استهلاك النهاردة (الماكروز) -->
    <div class="glass card" style="margin-bottom: 20px; padding: 20px;">
        <h3 id="intakeTitle" style="margin-bottom: 15px; font-size: 1.3rem;">استهلاكك النهاردة 📊</h3>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem;">
            <span id="calLabel">السعرات</span><span id="calText">0 / 0</span>
        </div>
        <div style="height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 15px; overflow: hidden;">
            <div id="calBar" style="height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease;"></div>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem;">
            <span id="protLabel">البروتين</span><span id="protText">0 / 0g</span>
        </div>
        <div style="height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 15px; overflow: hidden;">
            <div id="protBar" style="height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease;"></div>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem;">
            <span id="carbLabel">الكارب</span><span id="carbText">0 / 0g</span>
        </div>
        <div style="height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 15px; overflow: hidden;">
            <div id="carbBar" style="height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease;"></div>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem;">
            <span id="fatLabel">الدهون</span><span id="fatText">0 / 0g</span>
        </div>
        <div style="height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 15px; overflow: hidden;">
            <div id="fatBar" style="height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease;"></div>
        </div>
    </div>

    <!-- قسم شرب الماية -->
    <div class="glass card" style="margin-bottom: 20px; padding: 20px;">
        <h3 id="waterTitle" style="margin-bottom: 20px; font-size: 1.3rem;">شرب الماية 💧</h3>
        <div style="display: flex; justify-content: space-around; align-items: center;">
            <button onclick="updateWater(-1)" style="width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.3); color: var(--text-primary); display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: none; padding: 0; font-size: 1.5rem; flex-shrink: 0;">-</button>
            <span id="waterCount" style="font-weight: bold; font-size: 1.8rem; color: var(--primary);">0 💧</span>
            <button onclick="updateWater(1)" style="width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #111; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3); padding: 0; font-size: 1.5rem; flex-shrink: 0;">+</button>
        </div>
    </div>

    <!-- قسم التقرير اليومي -->
    <div class="glass card" id="submitSection" style="margin-bottom: 20px; padding: 20px;">
        <h3 id="reportTitle" style="margin-bottom: 15px; font-size: 1.3rem;">تقريرك اليومي</h3>
        <textarea id="dailyNotes" rows="3" placeholder="ملاحظاتك النهاردة (مثلاً: نمت كويس، حاسس بإرهاق...)" style="margin-bottom: 15px;"></textarea>
        
        <div style="margin-bottom: 15px;">
            <label for="progressPhoto" style="display: block; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.5); text-align: center; cursor: pointer; color: #fff; transition: all 0.3s ease; backdrop-filter: blur(5px);">
                <span id="photoStatus"> ضيف صورة تطورك </span>
                <input type="file" id="progressPhoto" accept="image/*" style="display: none;" onchange="updatePhotoStatus()">
            </label>
        </div>

        <button id="submitBtn" onclick="saveDailyLog()" style="margin-bottom: 0;">ابعت التقرير للكوتش</button>
    </div>
    
</div>
        <!-- التاب الثاني: التغذية والأكل -->
        <div id="tab-nutrition" class="tab-content">
            <div class="glass card" style="position: relative; z-index: 10; margin-bottom: 25px;"> 
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"> 
                    <h3 id="addMealTitle" style="margin: 0; font-size: 1.3rem; font-weight: bold; color: var(--primary);">ضيف أكلة 🍽️</h3>
                    <div style="display: flex; gap: 10px;"> 
                        <button onclick="document.getElementById('aiImgInput').click()" style="padding: 8px 15px; width: auto; font-size: 1rem; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center; color: var(--primary);">✨ AI</button>
                        <input type="file" id="aiImgInput" accept="image/*" style="display: none;" onchange="analyzeFoodAI(this)">
                        <button onclick="toggleScanner()" style="padding: 8px 15px; width: auto; font-size: 1rem; background: rgba(0,0,0,0.3); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center;">📷</button>
                    </div>
                </div>
                
                <div id="scannerContainer" style="display:none; text-align:center; margin-bottom:20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px dashed var(--primary);">
                    <video id="scannerVideo" style="width:100%; border-radius:8px;"></video>
                    <p id="camInstruction" style="font-size:0.9rem; color:var(--text-secondary); margin-top: 10px;">وجه الكاميرا لباركود المنتج</p>
                </div>

                <div style="position: relative; margin-bottom: 20px;"> 
                    <input type="text" id="searchInput" placeholder="دور على أكلة (فراخ، رز، شوفان...)" onkeyup="handleSearch()" style="margin-bottom: 0;"> 
                    <div id="suggestions"></div>
                </div>
                
                <div style="display: flex; gap: 12px; align-items: stretch;"> 
                    <input type="number" id="gramsInput" placeholder="الكمية بالجرام" style="flex: 2; margin-bottom: 0; font-size: 1.1rem; padding: 14px;">
                    <button id="addBtn" onclick="addMeal()" style="flex: 1; margin-bottom: 0; font-size: 1.1rem; padding: 14px; background: var(--primary); color: #111; font-weight: bold;">ضيف +</button>
                </div>
            </div>

            <div class="glass card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 id="todayLogTitle" style="margin: 0; font-size: 1.3rem; font-weight: bold; color: var(--primary);">أكل النهاردة</h3>
                    <button id="resetBtn" onclick="resetDay()" class="danger-btn" style="width: auto; padding: 8px 15px; font-size: 0.9rem; border-radius: 8px;">امسح الكل 🔄</button>
                </div>
                <div id="mealsList"></div>
            </div>
        </div>

        <!-- التاب الثالث: التمارين (بخلفية مخصصة) -->
<div id="tab-workouts" class="tab-content" style="background: linear-gradient(rgba(18, 18, 25, 0.85), rgba(18, 18, 25, 0.85)), url('https://i.ibb.co/rKGsHC7J/emini-Generated-Image-h9jnu9h9jnu9h9jn.jpg') center/cover no-repeat; padding: 20px; border-radius: 20px; min-height: 75vh; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);">
            <div id="workoutsList"></div>
            <button id="saveWorkoutBtn" onclick="saveWorkoutLog()" style="margin-top: 15px; margin-bottom: 30px;">احفظ أوزانك</button>
        </div>

    </div>
</div>

<!-- نافذة عرض الفيديو (تم إصلاح الإخفاء والتصميم المنبثق) -->
<div id="videoModal" class="modal" style="display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(8px); justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #1e1e28; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; width: 90%; max-width: 500px; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.6);">
        <!-- علامة الـ X للقفل -->
        <span class="close-modal" onclick="closeVideo()" style="position: absolute; top: 10px; left: 15px; font-size: 2rem; color: #aaa; cursor: pointer; line-height: 1;">&times;</span>
        
        <h3 id="videoTitle" style="margin-bottom: 15px; color: var(--primary); font-size: 1.3rem;">شرح التمرين</h3>
        <div id="videoContainer"></div>
    </div>
</div>

<!-- البار السفلي -->
<div id="bottomNav" class="bottom-nav" style="display: none;">
    <div class="nav-item active" onclick="switchTab('dashboard', this)">
        <span class="nav-icon">📊</span><span id="navDashboard">الخطة</span>
    </div>
    <div class="nav-item" onclick="switchTab('nutrition', this)">
        <span class="nav-icon">🍴</span><span id="navNutrition">الأكل</span>
    </div>
    <div class="nav-item" onclick="switchTab('workouts', this)">
        <span class="nav-icon">🏋️‍♂️</span><span id="navWorkouts">التمارين</span>
    </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
