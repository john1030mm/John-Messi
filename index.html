<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Messi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body data-theme="dark">

<div class="container">
    <!-- الـ Header الجديد -->
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0 5px;">
        <h1 style="font-size: 1.6rem; font-weight: 800; margin: 0;">John<span style="color: var(--primary);">Messi</span></h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="langBtn" onclick="toggleLang()" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); border-radius: 12px; padding: 6px 12px; font-size: 0.9rem; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); box-shadow: none; width: auto; height: 35px; display: flex; align-items: center; justify-content: center;">🌐 AR</button>
            <button id="themeBtn" onclick="toggleTheme()" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); border-radius: 50%; width: 35px; height: 35px; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(5px); box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0;">☀️</button>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="glass card">
        <h2 id="loginTitle">تسجيل الدخول</h2>
        <input type="text" id="clientIdInput" placeholder="كود العميل (مثال: 1001)">
        <input type="password" id="clientPassInput" placeholder="الباسورد">
        <button id="loginBtn" onclick="login()">ادخل</button>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" style="display: none;">
        
        <!-- التاب الأول: الخطة والمتابعة -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="glass card">
                <h3 id="coachPlanTitle">نصايح الكوتش 🎯</h3>
                <p id="coachPlanText" style="color: var(--primary); font-weight: bold; line-height: 1.5;"></p>
            </div>

            <div class="glass card">
                <h3 id="intakeTitle">استهلاكك النهاردة 📊</h3>
                <div class="macro-row"><span id="calLabel">السعرات</span><span id="calText">0 / 0</span></div>
                <div class="progress-bg"><div class="progress-fill" id="calBar"></div></div>
                
                <div class="macro-row"><span id="protLabel">البروتين</span><span id="protText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="protBar"></div></div>
                
                <div class="macro-row"><span id="carbLabel">الكارب</span><span id="carbText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="carbBar"></div></div>
                
                <div class="macro-row"><span id="fatLabel">الدهون</span><span id="fatText">0 / 0g</span></div>
                <div class="progress-bg"><div class="progress-fill" id="fatBar"></div></div>
            </div>

            <div class="glass card">
                <h3 id="waterTitle">شرب الماية 💧</h3>
                <div style="display: flex; justify-content: space-around; align-items: center; font-size: 1.5rem;">
                    <button onclick="updateWater(-1)" style="width: 50px; background: rgba(255,255,255,0.1); color: var(--text-primary);">-</button>
                    <span id="waterCount" style="font-weight: bold;">0 💧</span>
                    <button onclick="updateWater(1)" style="width: 50px;">+</button>
                </div>
            </div>

            <div class="card" id="submitSection">
                <h3 id="reportTitle">تقريرك اليومي 🚀</h3>
                <textarea id="dailyNotes" rows="3" placeholder="ملاحظاتك النهاردة (مثلاً: نمت كويس، حاسس بإرهاق...)"></textarea>
                
                <div style="margin: 15px 0;">
                    <label for="progressPhoto" style="display: block; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.5); text-align: center; cursor: pointer; color: #fff; transition: all 0.3s ease; backdrop-filter: blur(5px);">
                        <span id="photoStatus">📸 ضيف صورة تطور (اختياري)</span>
                        <input type="file" id="progressPhoto" accept="image/*" style="display: none;" onchange="updatePhotoStatus()">
                    </label>
                </div>

                <button id="submitBtn" onclick="saveDailyLog()">ابعت التقرير للكوتش 🚀</button>
            </div>
        </div>

        <!-- التاب الثاني: التغذية والأكل -->
        <div id="tab-nutrition" class="tab-content">
            <div class="glass card" style="position: relative; z-index: 10; margin-bottom: 25px;"> 
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"> 
                    <h3 id="addMealTitle" style="margin: 0; font-size: 1.3rem; font-weight: bold; color: var(--primary);">ضيف أكلة 🍽️</h3>
                    <div style="display: flex; gap: 10px;"> 
                        <button onclick="document.getElementById('aiImgInput').click()" style="padding: 8px 15px; width: auto; font-size: 1rem; border-radius: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center; color: var(--primary);">✨ AI</button>
                        <input type="file" id="aiImgInput" accept="image/*" style="display: none;" onchange="analyzeFoodAI(this)">
                        <button onclick="toggleScanner()" style="padding: 8px 15px; width: auto; font-size: 1rem; background: rgba(0,0,0,0.3); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center;">📷</button>
                    </div>
                </div>
                
                <div id="scannerContainer" style="display:none; text-align:center; margin-bottom:20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px dashed var(--primary);">
                    <video id="scannerVideo" style="width:100%; border-radius:8px;"></video>
                    <p id="camInstruction" style="font-size:0.9rem; color:var(--text-secondary); margin-top: 10px;">وجه الكاميرا لباركود المنتج</p>
                </div>

                <div style="position: relative; margin-bottom: 20px;"> 
                    <input type="text" id="searchInput" placeholder="دور على أكلة (فراخ، رز، شوفان...)" onkeyup="handleSearch()" style="margin-bottom: 0;"> 
                    <div id="suggestions"></div>
                </div>
                
                <div style="display: flex; gap: 12px; align-items: stretch;"> 
                    <input type="number" id="gramsInput" placeholder="الكمية بالجرام" style="flex: 2; margin-bottom: 0; font-size: 1.1rem; padding: 14px;">
                    <button id="addBtn" onclick="addMeal()" style="flex: 1; margin-bottom: 0; font-size: 1.1rem; padding: 14px; background: var(--primary); color: #111; font-weight: bold;">ضيف +</button>
                </div>
            </div>

            <div class="glass card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 id="todayLogTitle" style="margin: 0; font-size: 1.3rem; font-weight: bold; color: var(--primary);">أكل النهاردة</h3>
                    <button id="resetBtn" onclick="resetDay()" class="danger-btn" style="width: auto; padding: 8px 15px; font-size: 0.9rem; border-radius: 8px;">امسح الكل 🔄</button>
                </div>
                <div id="mealsList"></div>
            </div>
        </div>

        <!-- التاب الثالث: التمارين -->
        <div id="tab-workouts" class="tab-content">
            <div id="workoutsList"></div>
            <button id="saveWorkoutBtn" onclick="saveWorkoutLog()" style="margin-top: 15px; margin-bottom: 30px;">احفظ أوزانك 💾</button>
        </div>

    </div>
</div>

<!-- نافذة عرض الفيديو -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeVideo()">&times;</span>
        <h3 id="videoTitle" style="margin-bottom: 15px;">شرح التمرين</h3>
        <div id="videoContainer"></div>
    </div>
</div>

<!-- البار السفلي -->
<div id="bottomNav" class="bottom-nav" style="display: none;">
    <div class="nav-item active" onclick="switchTab('dashboard', this)">
        <span class="nav-icon">📊</span><span id="navDashboard">الخطة</span>
    </div>
    <div class="nav-item" onclick="switchTab('nutrition', this)">
        <span class="nav-icon">🍎</span><span id="navNutrition">الأكل</span>
    </div>
    <div class="nav-item" onclick="switchTab('workouts', this)">
        <span class="nav-icon">💪</span><span id="navWorkouts">التمارين</span>
    </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
